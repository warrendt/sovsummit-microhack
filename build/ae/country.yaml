regulatory:
  primary_law: UAE Federal Decree-Law No. 45 of 2021 on the Protection of Personal Data (PDPL)
  executive_regulations: Cabinet Decision No. 44 of 2023 (Executive Regulations of the PDPL)
  free_zone_carveout: DIFC and ADGM keep their own data-protection regimes, so jurisdiction depends on where the controller or processor is established and which free-zone legal perimeter the workload serves.
  frameworks:
    - UAE Federal PDPL (Federal Decree-Law No. 45 of 2021)
    - PDPL Executive Regulations (Cabinet Decision No. 44 of 2023)
    - DIFC Data Protection Law (DIFC Law No. 5 of 2020)
    - ADGM Data Protection Regulations 2021
    - UAE Information Assurance Standards (TDRA / formerly NESA)
    - CBUAE Consumer Protection Regulation and Consumer Protection Standards
    - Dubai Health Data Law (Dubai Law No. 13 of 2019 Regulating ICT in Health Fields)
  regulator_links:
    - name: UAE Data Office
      url: https://u.ae/en/about-the-uae/digital-uae/data/data-office
    - name: DIFC Commissioner of Data Protection
      url: https://www.difc.ae/business/laws-regulations/data-protection/
    - name: ADGM Office of Data Protection
      url: https://www.adgm.com/operating-in-adgm/office-of-data-protection
    - name: TDRA
      url: https://tdra.gov.ae/
    - name: Central Bank of the UAE
      url: https://www.centralbank.ae/
    - name: Dubai Health Authority
      url: https://www.dha.gov.ae/

scenarios:
