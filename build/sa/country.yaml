iso2: sa
name: Saudi Arabia
summit_edition: "Sovereignty Summit Saudi Arabia 2026"
language: en

azure:
  primary_region: saudiarabiaeast
  primary_region_display: Saudi Arabia East
  paired_region: qatarcentral
  paired_region_display: Qatar Central
  sovereign_region: true
  paired_region_rationale: "No public Azure pair is listed yet for Saudi Arabia East; this edition uses Qatar Central as the most plausible GCC geo-DR target when an out-of-country recovery site is explicitly approved."
  availability_architecture: "Three in-country availability zones first; use cross-border DR only by exception."
  confidential_compute_skus:
    - Standard_DC2as_v5
    - Standard_DC4as_v5
    - Standard_EC2as_v5
    - Standard_EC4as_v5
  cmk_hsm_sku: Premium
  azure_local_instance_location: saudiarabiaeast
  arc_region: saudiarabiaeast

regulatory:
  primary_law: Personal Data Protection Law (PDPL) — Royal Decree M/19 dated 9/2/1443 AH
  enforcement_status: In force since 14 September 2023; the one-year compliance grace period ended on 14 September 2024
  primary_regulator: Saudi Data & AI Authority (SDAIA)
  public_sector_cyber_regulator: National Cybersecurity Authority (NCA)
  financial_sector_regulator: Saudi Central Bank (SAMA)
  regulator_split: "SDAIA administers PDPL and transfer rules, NCA sets the national cyber baseline for government and critical sectors, and SAMA layers sector-specific cyber, outsourcing, cloud, audit, and exit obligations onto regulated financial institutions."
  cross_border_transfer_model: "Transfers outside the Kingdom must satisfy PDPL Article 29 and SDAIA's transfer regulation: assess destination risk, use an approved safeguard such as SCCs or BCRs when no adequacy decision exists, and obtain regulator approval where sector rules require it."
  frameworks:
    - PDPL + Implementing Regulations
    - SDAIA Regulation on Personal Data Transfer Outside the Kingdom
    - SAMA Cyber Security Framework (Rulebook)
    - SAMA cloud computing / third-party requirements (Rulebook §3.4)
    - NCA Essential Cybersecurity Controls (ECC-2:2024)
    - NCA Cloud Cybersecurity Controls (CCC-2:2024)
    - NCA Critical Systems Cybersecurity Controls (CSCC-1:2019)
  regulator_links:
    - name: SDAIA / Personal Data Protection resources
      url: https://dgp.sdaia.gov.sa/wps/portal/pdp/knowledgecenter/
    - name: Saudi Central Bank (SAMA) Rulebook
      url: https://rulebook.sama.gov.sa/en/
    - name: National Cybersecurity Authority (NCA)
      url: https://nca.gov.sa/en/regulatory-documents/

scenarios:
  public_sector_tenant: "A Saudi Vision 2030 government entity operating a national licensing and permits platform"
  financial_tenant: "A SAMA-regulated bank running instant payments and digital-wallet services"

sponsor:
  primary: Microsoft Arabia
  community: Sovereignty Summit KSA Chapter

