iso2: qa
name: Qatar
summit_edition: "Sovereignty Summit Qatar 2026"
language: en

azure:
  primary_region: qatarcentral
  primary_region_display: Qatar Central
  paired_region: uaenorth
  paired_region_display: UAE North
  official_region_pair: Qatar Central has no official Azure pair
  dr_region_rationale: UAE North is used in this edition as the customer-selected DR and approved transfer region.
  sovereign_region: false
  in_country_region_available: true
  confidential_compute_available: false
  confidential_compute_skus: []
  confidential_compute_note: As of 2026, Azure Products by Region still does not show Confidential Compute / confidential VM SKUs as GA in Qatar Central; this edition therefore uses CMK, tokenisation, private connectivity and SQL column-level protections as compensating controls.
  cmk_hsm_sku: Premium
  azure_local_instance_location: qatarcentral
  arc_region: qatarcentral

regulatory:
  primary_law: Personal Data Privacy Protection Law (Law No. 13 of 2016)
  executive_regulations: As of 2026, no public PDPPL executive-regulation text was verified; the operable public compliance baseline is Law No. 13 of 2016 plus NCSA / NDPO guidance and enforcement decisions.
  primary_regulator: National Cyber Security Agency (NCSA) / National Data Privacy Office (NDPO)
  primary_regulator_url: https://www.ncsa.gov.qa/
  qcb_regulation_url: https://www.qcb.gov.qa/Documents/InformationSecurity/Cloud%20Computing%20Regulation.pdf
  qfc_dpo_url: https://www.qfc.qa/en/operating-with-qfc/data-protection
  frameworks:
    - Qatar PDPPL (Law No. 13 of 2016)
    - NCSA / NDPO PDPPL guidance suite for regulated entities
    - National Information Assurance Standard v2.1 (May 2023)
    - National Data Classification Policy [IAP-NAT-DCLS]
    - Qatar Central Bank Cloud Computing Regulation (effective 15 April 2024)
    - QFC Data Protection Regulations 2021 and Data Protection Rules 2021 (in force 19 June 2022)
  classification_scheme:
    - Public
    - Internal
    - Limited Access
    - Restricted
  cross_border_rule: PDPPL Article 15 is not a blanket localisation rule, but controllers still need a documented legality, privacy and processor-risk assessment before cross-border transfers; for QCB-regulated workloads, QCB Cloud Computing Regulation 21.4 is stricter and requires PII and financial information to be processed within Qatar.
  qfc_contrast: QFC firms follow a separate QFC Data Protection Regulations 2021 regime administered by the QFC Data Protection Office; it is GDPR-style, contract-heavy and distinct from mainland Qatar PDPPL compliance.
  regulator_links:
    - name: National Cyber Security Agency / National Data Privacy Office
      url: https://www.ncsa.gov.qa/
    - name: Qatar Central Bank Cloud Computing Regulation
      url: https://www.qcb.gov.qa/Documents/InformationSecurity/Cloud%20Computing%20Regulation.pdf
    - name: QFC Data Protection Office
      url: https://www.qfc.qa/en/operating-with-qfc/data-protection

scenarios:
  public_sector_tenant: Ministry of Communications and Information Technology (MCIT) digital public-services platform aligned to Qatar National Vision 2030
  financial_tenant: A QCB-regulated bank launching a real-time merchant-payments platform in Doha
  qfc_tenant: A QFC-licensed asset manager receiving investor-reporting and risk analytics extracts

sponsor:
  primary: Microsoft Qatar
  community: Sovereignty Summit QA Chapter

extra_challenges:
  - challenge-qa-01-pdppl-nia-classification
  - challenge-qa-02-qcb-payments-landing-zone
