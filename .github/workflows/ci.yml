name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    name: Render every country
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r tools/requirements.txt
      - name: Render all countries (check mode)
        run: python tools/render.py --check
      - name: Render all countries (real)
        run: python tools/render.py
      - name: Smoke-test ZA bundle
        run: |
          test -f build/za/Readme.md
          test -f build/za/challenges/challenge-sa-01-popia-residency.md
          test -f build/za/challenges/challenge-01.md
          grep -q "southafricanorth" build/za/Readme.md
          grep -q "POPIA" build/za/Readme.md
          # Walkthroughs and lab guides must NOT ship in attendee bundles.
          if [ -d build/za/walkthrough ]; then
            echo "Trainer walkthroughs leaked into attendee bundle"; exit 1
          fi
          if [ -f build/za/LOCAL_LAB.md ]; then
            echo "Lab guide leaked into attendee bundle"; exit 1
          fi
          # Schema doc legitimately contains the literal token syntax; exclude it.
          if grep -RIn "\${country\." build/za/ --exclude-dir=schema; then
            echo "Unresolved tokens in ZA bundle"; exit 1
          fi
      - name: Drift check — committed build/ must match fresh render
        run: |
          if ! git diff --quiet -- build/; then
            echo "build/ is stale. Run 'python tools/render.py' and commit the result."
            git --no-pager diff --stat -- build/
            exit 1
          fi

  yamllint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yml countries/ common/schema/
